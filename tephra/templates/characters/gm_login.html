{% extends "base.html" %}
{% block content %}
<div class="paper" style="max-width:420px;margin:40px auto">
  <h1>Narrator login</h1>
  <p class="muted small">Narrator accounts are Django staff users (<code>python manage.py createsuperuser</code>).</p>
  <form method="post" class="stack">{% csrf_token %}{{ form.as_div }}
    <input type="hidden" name="next" value="{{ next|default:'/gm/' }}">
    <button class="btn primary">Log in</button>
  </form>
</div>
{% endblock %}
