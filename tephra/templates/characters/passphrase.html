{% extends "base.html" %}
{% block content %}
<div class="paper" style="max-width:420px;margin:40px auto">
  <h1>{% t "Tephra Sheets" %}</h1>
  <p class="muted">{% t "This site is for our group. Enter the group passphrase; this browser remembers it." %}</p>
  {% if error %}<ul class="messages"><li class="error">{{ error }}</li></ul>{% endif %}
  <form method="post" class="stack">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <input type="password" name="passphrase" autofocus required aria-label="{% t "Passphrase" %}" style="width:100%">
    <button class="btn primary">{% t "Enter" %}</button>
  </form>
</div>
{% endblock %}
