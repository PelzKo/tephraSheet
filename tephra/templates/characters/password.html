{% extends "base.html" %}
{% block content %}
<div class="paper" style="max-width:420px;margin:40px auto">
  <h1>{% t "Change password" %}</h1>
  <p class="muted">{{ character }}</p>
  <form method="post" class="stack">{% csrf_token %}{{ form.as_div }}
    <div class="row spread"><a href="{% url 'sheet' character.pk %}">{% t "← Back" %}</a><button class="btn primary">{% t "Save" %}</button></div>
  </form>
</div>
{% endblock %}
